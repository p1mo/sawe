[package]
name = "sawe"
version = "0.1.6"
edition = "2021"
description = "wrapper for salvo with handlebars, ufs, uiicons & SEO rendering"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p1mo/sawe"
readme = "README.md"
keywords = ["http", "assets", "salvo", "web", "server"]
categories = ["development-tools", "web-programming", "filesystem"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]

[package.metadata.docs.rs]
no-default-features = false
features = [
  "db",
  "db-pg",
  "db-sqlite",
  "docs",
  "templates",
  "templates-build",
  "seo",
  "seo-google",
]

[features]
default = []

all = [ "db", "docs", "templates", "templates-build", "seo", "seo-google" ]

db = [ "db-pg", "db-sqlite" ]
db-pg = [ "dep:sqlx", "sqlx/postgres", "sqlx/ipnet", "sqlx/json" ]
db-sqlite = [ "dep:sqlx", "sqlx/sqlite" ]

docs = [ "dep:handlebars", "dep:parking_lot", "dep:globset", "dep:ufs" ]

templates = [ "dep:handlebars", "dep:parking_lot", "dep:globset", "dep:ufs", "dep:uiicons" ]
templates-build = [ "dep:uiicons", "uiicons/build" ]

seo = []
seo-google = []

[dependencies]
tracing = "0.1.44"
thiserror = "2.0.21"

schemars = "1.2.2"
serde_json = "1.0.152"
serde = { version = "1.0.229", features = ["derive"] }

handlebars = { version = "6.4.4", optional = true }
parking_lot = { version = "0.13.0", optional = true }
globset = { version = "0.4.21", optional = true, features = ["serde1"] }

ufs = { version = "0.1.4", optional = true }
uiicons = { version = "0.1.6", optional = true, features = ["build"] }

sqlx = { version = "0.9.0", optional = true, features = [
  "any", "derive", "macros", "migrate",
  # Global Type Support
  "uuid", "chrono", "bstr", "rust_decimal",
  # RT + TLS
  "runtime-tokio", "tls-rustls-aws-lc-rs"
] }

tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

http = "1.5.0"
rcgen = "0.14.10"
salvo = { version = "1.2.1", features = ["oapi", "affix-state", "trailing-slash", "force-https", "size-limiter", "request-id", "rate-limiter", "quinn", "logging"] }